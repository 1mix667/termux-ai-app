pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
    // Resolve plugin markers directly to their modules. This avoids the
    // plugin-marker lookup on the Gradle Plugin Portal (which currently
    // 303-redirects these markers to Maven Central where they 404).
    // The coordinates below are exactly what the markers point to.
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'com.android.application') {
                useModule('com.android.tools.build:gradle:8.7.0')
            }
            if (requested.id.id == 'com.android.library') {
                useModule('com.android.tools.build:gradle:8.7.0')
            }
            if (requested.id.id == 'org.jetbrains.kotlin.android') {
                useModule('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24')
            }
        }
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        // For potential native dependencies
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
}

rootProject.name = "Termux+"
include ':app'
include ':terminal-emulator'